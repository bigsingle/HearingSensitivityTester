<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可聴周波数域チェッカ ver 1.000</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0e8;
            margin: 20px;
            display: flex;
            justify-content: center;
        }

        .window {
            width: 480px;
            background-color: #ece9d8;
            border: 2px solid #0055ea;
            border-radius: 5px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            padding: 10px;
            box-sizing: border-box;
        }

        .title-bar {
            background: linear-gradient(to right, #0058ee, #3a93ff);
            color: white;
            font-weight: bold;
            padding: 4px 8px;
            margin: -10px -10px 10px -10px;
            border-top-left-radius: 3px;
            border-top-right-radius: 3px;
            font-size: 14px;
        }

        .menu-bar {
            font-size: 12px;
            margin-bottom: 10px;
            border-bottom: 1px solid #d0d0d0;
            padding-bottom: 3px;
        }

        .menu-bar span {
            margin-right: 15px;
            cursor: pointer;
        }

        .panel-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        fieldset {
            border: 1px solid #b5b5b5;
            border-radius: 4px;
            padding: 8px;
            margin: 0;
            background-color: #f4f4ec;
        }

        legend {
            font-size: 12px;
            color: #003399;
            font-weight: bold;
            padding: 0 4px;
        }

        .freq-display {
            flex: 1;
            text-align: center;
        }

        .freq-value {
            font-size: 28px;
            font-weight: bold;
            color: #000080;
            margin-top: 5px;
        }

        .manual-setting {
            flex: 1.2;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        button {
            background-color: #f2f2f2;
            border: 1px solid #7f9db9;
            border-radius: 3px;
            padding: 4px 2px;
            font-size: 11px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        button:active {
            background-color: #d0d0d0;
        }

        .check-area {
            width: 100%;
            box-sizing: border-box;
        }

        .btn-large {
            width: 100%;
            padding: 8px;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .count-buttons {
            display: flex;
            gap: 5px;
            justify-content: space-between;
        }

        .count-buttons button {
            flex: 1;
            padding: 6px 0;
            font-size: 12px;
        }

        .results-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .result-box {
            flex: 1;
            text-align: center;
        }

        .result-value {
            font-size: 24px;
            font-weight: bold;
            color: #000080;
            margin-top: 5px;
        }

        .bottom-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 12px;
        }

        .bottom-buttons button {
            padding: 4px 15px;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">可聴周波数域チェッカ ver 1.000</div>
    <div class="menu-bar">
        <span>ファイル(F)</span>
        <span>サウンド(S)</span>
        <span>ヘルプ(H)</span>
    </div>

    <!-- 上段：現在の周波数と手動設定 -->
    <div class="panel-row">
        <fieldset class="freq-display">
            <legend>現在の周波数</legend>
            <div class="freq-value" id="currentFreqText">10000 Hz</div>
        </fieldset>

        <fieldset style="flex: 1.3;">
            <legend>周波数手動設定</legend>
            <div class="manual-setting">
                <button onclick="setFreq(8000)">8kHz</button>
                <button onclick="changeFreq(1000)">+1kHz</button>
                <button onclick="changeFreq(100)">+100Hz</button>
                <button onclick="changeFreq(10)">+10Hz</button>
                <button onclick="setFreq(16000)">16kHz</button>
                <button onclick="changeFreq(-1000)">-1kHz</button>
                <button onclick="changeFreq(-1000)">-100Hz</button>
                <button onclick="changeFreq(-10)">-10Hz</button>
            </div>
        </fieldset>
    </div>

    <!-- 中段：可聴チェック -->
    <fieldset class="check-area">
        <legend>可聴チェック</legend>
        <button class="btn-large" id="startBtn" onclick="startTest()">チェック開始</button>
        
        <fieldset style="margin-top: 5px;">
            <legend>音の鳴った回数</legend>
            <div class="count-buttons">
                <button onclick="answer(1)">1</button>
                <button onclick="answer(2)">2</button>
                <button onclick="answer(3)">3</button>
                <button onclick="answer(4)">4</button>
                <button onclick="answer(5)">5</button>
                <button style="flex: 1.8;" onclick="answer(0)">分からない！</button>
            </div>
        </fieldset>
    </fieldset>

    <!-- 下段：最高可聴周波数と正答率 -->
    <div class="results-row">
        <fieldset class="result-box">
            <legend>最高可聴周波数</legend>
            <div class="result-value" id="maxFreqText">--- Hz</div>
        </fieldset>
        <fieldset class="result-box">
            <legend>正答率</legend>
            <div class="result-value" id="accuracyText">0.0 %</div>
        </fieldset>
    </div>

    <!-- 最下部ボタン -->
    <div class="bottom-buttons">
        <button onclick="resetAll()">初めからやり直す(C)</button>
        <button onclick="alert('ブラウザのタブを閉じて終了してください。')">終了(X)</button>
    </div>
</div>

<script>
    let audioCtx = null;
    let currentFreq = 10000;
    let actualBeepCount = 0;
    let isTesting = false;
    
    let totalTests = 0;
    let correctTests = 0;
    let maxAudibleFreq = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function updateDisplay() {
        document.getElementById('currentFreqText').innerText = `${currentFreq} Hz`;
        document.getElementById('maxFreqText').innerText = maxAudibleFreq > 0 ? `${maxAudibleFreq} Hz` : '--- Hz';
        
        const accuracy = totalTests > 0 ? ((correctTests / totalTests) * 100).toFixed(1) : '0.0';
        document.getElementById('accuracyText').innerText = `${accuracy} %`;
    }

    function setFreq(val) {
        currentFreq = Math.max(20, Math.min(22000, val));
        updateDisplay();
    }

    function changeFreq(delta) {
        setFreq(currentFreq + delta);
    }

    // ビープ音を1回再生する関数（Web Audio API）
    function playBeep(duration = 0.15) {
        return new Promise((resolve) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(currentFreq, audioCtx.currentTime);

            // クリックノイズ防止のためのフェードイン・フェードアウト
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.02);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime + duration - 0.02);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
            osc.onended = resolve;
        });
    }

    // ランダムな回数（1〜5回）音を鳴らす処理
    async function startTest() {
        initAudio();
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        if (isTesting) return;
        isTesting = true;

        const startBtn = document.getElementById('startBtn');
        startBtn.innerText = '再生中...';
        startBtn.disabled = true;

        // 1〜5回のランダムな回数を設定
        actualBeepCount = Math.floor(Math.random() * 5) + 1;

        // 音の再生ループ
        for (let i = 0; i < actualBeepCount; i++) {
            await playBeep(0.15);
            // 音同士の間隔（200ms間）
            await new Promise(r => setTimeout(r, 200));
        }

        startBtn.innerText = '回答を選択してください';
    }

    // 回答判定
    function answer(userAnswer) {
        if (!isTesting) return;

        totalTests++;

        if (userAnswer === actualBeepCount) {
            correctTests++;
            if (currentFreq > maxAudibleFreq) {
                maxAudibleFreq = currentFreq;
            }
            alert(`正解です！（鳴った回数: ${actualBeepCount}回）`);
        } else {
            alert(`不正解です。（正解は ${actualBeepCount}回 でした）`);
        }

        isTesting = false;
        const startBtn = document.getElementById('startBtn');
        startBtn.innerText = 'チェック開始';
        startBtn.disabled = false;

        updateDisplay();
    }

    function resetAll() {
        currentFreq = 10000;
        actualBeepCount = 0;
        isTesting = false;
        totalTests = 0;
        correctTests = 0;
        maxAudibleFreq = 0;
        
        const startBtn = document.getElementById('startBtn');
        startBtn.innerText = 'チェック開始';
        startBtn.disabled = false;

        updateDisplay();
    }

    // 初期表示設定
    updateDisplay();
</script>

</body>
</html>
